# DASH MEDIC CARE — configuración de Netlify
# El sitio sigue siendo HTML estático; el build sólo copia las páginas a /dist
# (sin README, código de funciones ni respaldos) y Netlify empaqueta las Functions.

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Variables que NO son secretas (aparecen en el código o en las páginas publicadas).
  # El escaneo de secretos de Netlify sigue revisando las llaves reales (STRIPE_SECRET_KEY, etc.).
  SECRETS_SCAN_OMIT_KEYS = "LIDER_CODIGO,CORPORATIVOS_ACTIVOS,UMBRAL_BOLSA,FACTURACION_ACTIVA,FACTURACION_SOLO_MES_EN_CURSO,SAT_CLAVE_PRODUCTO,SAT_CLAVE_UNIDAD,LUGAR_EXPEDICION_CP,STRIPE_LINK_MENSUAL,STRIPE_LINK_TRIMESTRAL,STRIPE_LINK_ANUAL,STRIPE_PRICE_MENSUAL,STRIPE_PRICE_TRIMESTRAL,STRIPE_PRICE_ANUAL,EVERHEALTH_EMAIL,ADMIN_EMAIL,EMAIL_FROM,EMAIL_REPLY_TO,SITE_URL"

[functions]
  node_bundler = "esbuild"
